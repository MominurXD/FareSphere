name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: PYTHONPATH=. pytest -q

      - name: Validate web JavaScript
        run: node --check web/app.js

      - name: Run globe geometry tests
        run: node --test web/tests/*.test.mjs

      - name: Validate static UI
        run: python scripts/validate_static.py

      - name: Verify production Docker image builds
        run: docker build -t faresphere-ci .
