services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      ENABLE_SAMPLE_DATA: ${ENABLE_SAMPLE_DATA:-false}
      TFL_APP_KEY: ${TFL_APP_KEY:-}
      NATIONAL_RAIL_API_KEY: ${NATIONAL_RAIL_API_KEY:-}
      NATIONAL_RAIL_DEPARTURES_URL: ${NATIONAL_RAIL_DEPARTURES_URL:-}
      DUFFEL_ACCESS_TOKEN: ${DUFFEL_ACCESS_TOKEN:-}
      TRAINLINE_API_BASE_URL: ${TRAINLINE_API_BASE_URL:-}
      TRAINLINE_API_TOKEN: ${TRAINLINE_API_TOKEN:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
